[package]
name = "bamcensus-py"
version = "0.2.0"
edition = "2021"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/NLR/bamcensus"
documentation = "https://docs.rs/bamcensus-py"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "bamcensus_py"
crate-type = ["cdylib"]

[dependencies]
bamcensus = { path = "../bamcensus", version = "0.2.0" }
bamcensus-acs = { path = "../bamcensus-acs", version = "0.2.0" }
bamcensus-core = { path = "../bamcensus-core", version = "0.2.0" }
bamcensus-lehd = { path = "../bamcensus-lehd", version = "0.2.0" }
bamcensus-tiger = { path = "../bamcensus-tiger", version = "0.2.0" }
itertools = { workspace = true }
pyo3 = { version = "0.22.2", features = [
    "extension-module",
    "serde",
    # "experimental-async",
    "abi3-py310",
] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
wkt = { workspace = true }
