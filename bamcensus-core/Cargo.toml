[package]
name = "bamcensus-core"
version = "0.2.0"
edition = "2021"
license = "BSD-3-Clause"
readme = "README.md"
description = "Common record types + operations for bamcensus crates"
repository = "https://github.com/NLR/bamcensus"
documentation = "https://docs.rs/bamcensus-core"

[dependencies]
clap = { workspace = true }
derive_more = { workspace = true }
geo-types = { workspace = true, features = ["serde"] }
itertools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
