[workspace]
resolver = "2"
members = [
    "bamcensus",
    "bamcensus-acs",
    "bamcensus-core",
    "bamcensus-lehd",
    "bamcensus-py",
    "bamcensus-tiger",
]

[workspace.dependencies]
clap = { version = "4.6.10", features = ["derive", "env"] }
config = "0.15.27"
csv = { version = "1.4.0" }
derive_more = { version = "2.1.1", features = ["sum"] }
env_logger = "0.11.12"
flate2 = "1.1.11"
futures = { version = "0.3.34" }
geo = { version = "0.33.1", features = ["use-serde"] }
geo-types = "0.7.13"
geojson = { version = "1.0.0" }
itertools = { version = "0.15.0" }
kdam = "0.6.4"
log = "0.4.35"
rayon = "1.12.0"
reqwest = { version = "0.13.5", features = ["json"] }
reqwest-middleware = { version = "0.5.2", features = ["json"] }
reqwest-retry = "0.9.1"
schemars = "1.2.3"
serde = { version = "1.0.209", features = ["derive"] }
serde_json = { version = "1.0.154" }
shapefile = { version = "0.9.0", features = ["geo-types"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-test = "0.4.6"
tokio-util = { version = "0.7.20", features = ["compat"] }
wkt = { version = "0.15.0", features = ["serde"] }
zip = "9.8.2"
