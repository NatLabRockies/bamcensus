[package]
name = "bamcensus-acs"
version = "0.2.0"
license = "BSD-3-Clause"
edition = "2021"
readme = "README.md"
description = "Interaction with the American Community Survey API"
repository = "https://github.com/NLR/bamcensus"
documentation = "https://docs.rs/bamcensus-acs"

[features]
schemars = ["dep:schemars", "bamcensus-core/schemars"]

[dependencies]
bamcensus-core = { path = "../bamcensus-core", version = "0.2.0" }
clap = { workspace = true }
futures = { workspace = true }
itertools = { workspace = true }
kdam = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
